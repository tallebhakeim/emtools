name: Build EMtools (apps de bureau)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: '--target universal-apple-darwin'
            label: macOS
          - os: windows-latest
            args: ''
            label: Windows-x64
          - os: ubuntu-latest
            args: '--bundles deb,appimage'
            label: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cibles macOS (universel)
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Dépendances Linux (WebKitGTK)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Dépendances npm
        run: npm install

      - name: Compiler l'app (Tauri)
        run: npx tauri build ${{ matrix.args }}

      - name: Récupérer les installeurs
        uses: actions/upload-artifact@v4
        with:
          name: EMtools-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
