<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>EMtools — Livret</title>
<style>
:root{--navy:#16243d;--navy2:#0f3a4d;--teal:#0d9488;--teal2:#0f766e;--mint:#5eead4;
  --text:#1e293b;--text2:#64748b;--muted:#94a3b8;--border:#e2e8f0;--bg:#f8fafc;--card:#fff;--gold:#d97706}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#525866}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;color:var(--text);-webkit-print-color-adjust:exact;print-color-adjust:exact}
@page{size:A4;margin:0}
.page{position:relative;width:210mm;height:297mm;background:#fff;overflow:hidden;page-break-after:always;break-after:page;padding:15mm 15mm 13mm}
.page:last-child{page-break-after:avoid;break-after:avoid}
@media screen{.page{margin:10mm auto;box-shadow:0 6px 30px rgba(0,0,0,.35)}}
@media print{.page{height:296mm}}

.rh{position:absolute;top:7mm;left:15mm;right:15mm;display:flex;justify-content:space-between;font-size:8.5pt;color:var(--muted);letter-spacing:.04em}
.rf{position:absolute;bottom:6.5mm;left:15mm;right:15mm;display:flex;justify-content:space-between;font-size:8.5pt;color:var(--muted)}

/* ---------- COVER ---------- */
.cover{padding:0;background:linear-gradient(150deg,#16243d 0%,#0f3a4d 55%,#0f766e 100%);color:#fff}
.cover .in{position:absolute;inset:0;padding:34mm 24mm;display:flex;flex-direction:column}
.cover .logo{width:30mm;height:30mm;border-radius:14px;margin-bottom:14mm}
.cover .kick{font-size:11pt;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--mint)}
.cover h1{font-size:33pt;font-weight:800;line-height:1.08;letter-spacing:-.02em;margin:6mm 0 0}
.cover .sub{font-size:13.5pt;color:#cbd5e1;margin-top:7mm;max-width:130mm;line-height:1.5}
.cover .spacer{flex:1}
.cover .stats{display:flex;gap:14mm;margin-bottom:12mm}
.cover .stats .n{font-size:24pt;font-weight:800}.cover .stats .l{font-size:9pt;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cover .by{font-size:10.5pt;color:#cbd5e1;line-height:1.6;border-top:1px solid rgba(255,255,255,.2);padding-top:7mm}
.cover .by b{color:#fff}
.cover .url{font-size:15pt;font-weight:800;color:var(--mint);margin-top:3mm}

/* ---------- INTRO ---------- */
.h2{font-size:20pt;font-weight:800;color:var(--navy);letter-spacing:-.01em}
.lead{font-size:11pt;line-height:1.6;color:var(--text);margin-top:5mm}
.lead b{color:var(--navy)}
.why{display:grid;grid-template-columns:1fr 1fr;gap:5mm;margin-top:9mm}
.why .c{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--teal);border-radius:9px;padding:5mm}
.why .c h4{font-size:11pt;color:var(--navy);margin-bottom:1.5mm}
.why .c p{font-size:9.5pt;color:var(--text2);line-height:1.5}
.toc{margin-top:10mm}
.toc h3{font-size:11pt;text-transform:uppercase;letter-spacing:.12em;color:var(--teal2);margin-bottom:4mm}
.toc ol{list-style:none}
.toc li{display:flex;align-items:center;gap:3mm;padding:2.6mm 0;border-bottom:1px dotted var(--border);font-size:11pt;color:var(--text)}
.toc li .ic{font-size:13pt;width:8mm;text-align:center}
.toc li .nm{font-weight:700;color:var(--navy)}
.toc li .ct{margin-left:auto;color:var(--text2);font-size:9.5pt}
.toc li .pg{margin-left:5mm;color:var(--teal2);font-weight:700;width:8mm;text-align:right}

/* ---------- DOMAIN PAGE (illustrated grid) ---------- */
.dh{display:flex;align-items:center;gap:4mm;margin-top:3mm}
.dh .ic{font-size:21pt}
.dh h2{font-size:18pt;font-weight:800;color:var(--navy);letter-spacing:-.01em}
.drule{height:3px;border-radius:3px;margin:3.5mm 0 4mm;background:var(--dc,#0d9488)}
.dintro{font-size:10pt;line-height:1.5;color:var(--text2);margin-bottom:5mm}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
.mini{border:1px solid var(--border);border-top:2.5px solid var(--dc,#0d9488);border-radius:9px;overflow:hidden;background:#fff;box-shadow:0 2px 10px rgba(22,36,61,.07)}
.mini .thumb{height:37mm;background:#0f1d33}
.mini .thumb img{width:100%;height:37mm;object-fit:cover;display:block}
.mini figcaption{padding:2.8mm 3.6mm 3.4mm}
.mini .n{font-size:10pt;font-weight:700;color:var(--navy);line-height:1.25}
.mini .n .e{margin-right:1.6mm}
.mini .p{font-size:8.5pt;color:var(--text2);line-height:1.4;margin-top:1.2mm}

/* ---------- CLOSING ---------- */
.close{background:linear-gradient(150deg,#0f766e,#16243d);color:#fff;padding:0}
.close .in{position:absolute;inset:0;padding:30mm 24mm;display:flex;flex-direction:column}
.close h2{font-size:24pt;font-weight:800;color:#fff}
.close .lead{color:#cbd5e1;font-size:12pt;max-width:135mm}
.close .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6mm;margin-top:10mm}
.close .b{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:6mm}
.close .b h4{color:var(--mint);font-size:11pt;margin-bottom:2mm}
.close .b p{font-size:9.5pt;color:#cbd5e1;line-height:1.5}
.close .spacer{flex:1}
.close .contact{border-top:1px solid rgba(255,255,255,.2);padding-top:7mm;font-size:11pt;line-height:1.8}
.close .contact a{color:var(--mint);text-decoration:none;font-weight:700}
.close .contact .big{font-size:14pt;font-weight:800;color:#fff}
</style>
</head>
<body>
<div id="book"></div>
<script>
// tool = [emoji, nom, desc, slug-image, position-verticale-vignette(%)]
const DOMAINS=[
 {ic:'📡',dc:'#2563eb',t:'Antennes & rayonnement',
  i:'Du dipôle au réseau planaire : impédance, diagrammes, gain et formation de faisceau, par la méthode des moments et les modèles analytiques.',
  tools:[['📡','Antennes filaires (MoM)','Dipôle, Yagi-Uda : impédance, VSWR, diagramme, champ proche.','antennes-filaires',56],
         ['📶','Réseaux d’antennes','Facteur de réseau, dépointage électronique, lobes.','antennes-reseaux',58],
         ['▦','Réseau planaire 2D','Dépointage azimut/élévation, diagramme 3D.','antennes-reseau2d',55],
         ['📣','Antennes cornet','Cornet pyramidal : gain, efficacité, plans E/H.','antennes-cornet',55],
         ['▭','Antennes patch','Microruban : synthèse W/L, résonance, directivité.','antennes-patch',64],
         ['🗼','Antennes MIMO','Capacité de Shannon, multiplexage spatial.','antennes-mimo',58]]},

 {ic:'🛰️',dc:'#0d9488',t:'Radar, RF, télécoms & sécurité',
  i:'Détection, localisation et liaisons sans fil — du radar au GPS, en passant par l’exposition RF et la RFID.',
  tools:[['🛰️','Radar','Équation du radar (1/R⁴), Doppler, RCS, FMCW.','radar',48],
         ['📱','Téléphonie & sécurité RF','1G→6G, ICNIRP, PIRE, distances de sécurité.','antenne-securite',52],
         ['🌐','GPS','Trilatération (4 satellites), GDOP, code C/A, relativité.','gps',45],
         ['📶','RFID / NFC — HF & UHF','Couplage inductif 13,56 MHz, codage, UHF.','rfid1356',50]]},

 {ic:'〰️',dc:'#7c3aed',t:'Lignes, circuits & puissance',
  i:'La propagation guidée et l’électronique : adaptation d’impédance, analyse de circuits et bilans de puissance.',
  tools:[['〰️','Lignes & guides d’onde','TOS, abaque de Smith, stubs ; microstrip, guide, fibre.','lignes',24],
         ['⚡','Circuit — SPICE light','Bode/transitoire/DC (MNA), BJT-MOS, AOP, auto-routage.','circuit-spice',32],
         ['📊','Puissances — mW, dBm, dB','Conversions, échelle, gains dB, bilan de Friis.','puissance',50]]},

 {ic:'🧲',dc:'#d97706',t:'Magnétisme & énergie',
  i:'Champs magnétiques et conversion d’énergie : des bobines au photovoltaïque et au transfert de puissance sans fil.',
  tools:[['🧲','Bobines de Helmholtz','Champ axial, condition de Helmholtz, uniformité.','helmholtz',55],
         ['🍩','Solénoïde & toroïdes','Lignes de champ 3D, profil axial, confinement.','bobines-toroide',50],
         ['🔋','Recharge sans fil (WPT)','Couplage inductif/résonant (k·Q) ou radiatif.','recharge-sans-fil',52],
         ['☀️','Photovoltaïque','Courbe I-V/P-V, MPPT, ensoleillement, technos.','photovoltaique',30]]},

 {ic:'🩻',dc:'#db2777',t:'Dosimétrie, santé & imagerie',
  i:'L’interaction des champs avec le vivant : du DAS à l’échauffement des tissus et à l’imagerie médicale.',
  tools:[['🌡️','Dosimétrie EM','Champ E → DAS → échauffement (Pennes 2D) ; import CST.','dosimetrie',52],
         ['🧍','Dosimétrie fantôme voxel','Fantôme voxélisé → SAR (TMM) → échauffement ; XCAT.','voxel',52],
         ['🧠','IRM — comment ça marche','Larmor, Bloch, k-space (FFT), contraste T1/T2, SAR.','irm',34]]},

 {ic:'⚙️',dc:'#0891b2',t:'Capteurs, systèmes & matériaux',
  i:'De la mesure au matériau : MEMS, optique, chaîne d’acquisition, compatibilité électromagnétique et métamatériaux.',
  tools:[['⚙️','MEMS électrostatiques','Pull-in, peigne interdigité, f₀/Q, tactile capacitif.','mems',52],
         ['🔬','Capteurs optiques & imagerie','Responsivité R(λ), spectromètre, CIE, NDVI, Bayer.','optique',26],
         ['📈','Capteurs & acquisition','Wheatstone, échantillonnage/Nyquist, CAN.','capteurs',52],
         ['📡','CEM','NEXT/FEXT, modes CM/DM, CISPR, blindage, ESD.','cem',30],
         ['🫥','Méta-matériaux','Propriétés effectives ; cape de Pendry.','cloaking',28]]}
];

const T={
 kick:'Catalogue des outils',title:'Simulateurs interactifs d’électromagnétisme & de physique appliquée',
 sub:'25 outils web rigoureux, autonomes et bilingues — pour comprendre, enseigner et concevoir.',
 s_tools:'outils',s_dom:'domaines',s_lang:'bilingue',
 by:'<b>Hakeim Talleb</b>, Professeur des Universités à Sorbonne Université, spécialiste de la modélisation en physique de l’ingénierie en électronique.',
 intro_h:'Pourquoi EMtools',
 lead:'<b>EMtools</b> rend <b>visibles et manipulables</b> les concepts d’électromagnétisme, de télécommunications, de capteurs, de dosimétrie et de compatibilité électromagnétique. Chaque outil tient dans une seule page, tourne dans <b>n’importe quel navigateur sans installation</b>, et repose sur des <b>modèles physiques validés numériquement</b>. Conçus pour l’<b>enseignement</b> comme pour l’<b>ingénierie</b>. Les vignettes de ce livret sont de <b>vraies captures</b> des outils.',
 why:[['✓ Validé numériquement','Chaque modèle est confronté à la théorie, aux normes ou à des cas tests de référence — pas une boîte noire.'],
      ['⚡ Sans installation','100 % navigateur, une page par outil, utilisable hors-ligne. Rien à configurer.'],
      ['🌐 Bilingue FR / EN','Bascule instantanée des langues, pensée pour la diffusion internationale.'],
      ['🔧 Extensible','De nouveaux modules peuvent être développés sur mesure selon les besoins.']],
 toc:'Sommaire',hdr:'EMtools · Catalogue',
 close_h:'Un besoin spécifique ?',
 close_lead:'EMtools peut être enrichi de modules sur mesure selon vos besoins.',
 close_b:[['Enseignement','Des supports interactifs pour vos cours et travaux dirigés, accessibles sur demande.'],
          ['Recherche','Des modèles validés numériquement pour explorer, illustrer et prototyper.'],
          ['Modules sur mesure','De nouveaux modules peuvent être développés selon votre cahier des charges.']],
 declare:'Se déclarer / demander un accès',licence:'© 2026 Hakeim Talleb · EMtools · Tous droits réservés.'
};

function coverPage(){
 return `<section class="page cover"><div class="in">
   <img class="logo" src="emtools-logo.svg" alt="EMtools">
   <div class="kick">${T.kick}</div><h1>EMtools</h1>
   <div class="sub">${T.title}.<br>${T.sub}</div>
   <div class="spacer"></div>
   <div class="stats"><div><div class="n">25</div><div class="l">${T.s_tools}</div></div>
     <div><div class="n">6</div><div class="l">${T.s_dom}</div></div>
     <div><div class="n">FR/EN</div><div class="l">${T.s_lang}</div></div></div>
   <div class="url">🌐 emtools.app</div>
   <div class="by">${T.by}<br>contact@novasensexpertise.com · © 2026</div>
 </div></section>`;
}
function introPage(){
 const why=T.why.map(w=>`<div class="c"><h4>${w[0]}</h4><p>${w[1]}</p></div>`).join('');
 let pg=3;const toc=DOMAINS.map(d=>`<li><span class="ic">${d.ic}</span><span class="nm">${d.t}</span><span class="ct">${d.tools.length} outils</span><span class="pg">${pg++}</span></li>`).join('');
 return `<section class="page"><div class="rh"><span>${T.hdr}</span><span>emtools.app</span></div>
   <h2 class="h2">${T.intro_h}</h2><p class="lead">${T.lead}</p>
   <div class="why">${why}</div>
   <div class="toc"><h3>${T.toc}</h3><ol>${toc}</ol></div>
   <div class="rf"><span>par Hakeim Talleb</span><span>2</span></div></section>`;
}
function domainPage(d,pageno){
 const cards=d.tools.map(t=>`<figure class="mini"><div class="thumb"><img src="catalogue-shots/${t[3]}.png" style="object-position:center ${t[4]}%" alt="${t[1]}"></div><figcaption><div class="n"><span class="e">${t[0]}</span>${t[1]}</div><div class="p">${t[2]}</div></figcaption></figure>`).join('');
 return `<section class="page" style="--dc:${d.dc}"><div class="rh"><span>${T.hdr}</span><span>${d.t}</span></div>
   <div class="dh"><span class="ic">${d.ic}</span><h2>${d.t}</h2></div><div class="drule"></div>
   <p class="dintro">${d.i}</p><div class="grid">${cards}</div>
   <div class="rf"><span><b>EMtools</b> — emtools.app</span><span>${pageno}</span></div></section>`;
}
function closePage(){
 const b=T.close_b.map(x=>`<div class="b"><h4>${x[0]}</h4><p>${x[1]}</p></div>`).join('');
 return `<section class="page close"><div class="in"><h2>${T.close_h}</h2><p class="lead">${T.close_lead}</p>
   <div class="grid2">${b}</div><div class="spacer"></div>
   <div class="contact"><div class="big">🌐 emtools.app</div>
     📝 ${T.declare} · <a href="https://tally.so/r/Bz967N">tally.so/r/Bz967N</a><br>
     ✉ <a href="mailto:contact@novasensexpertise.com">contact@novasensexpertise.com</a><br>
     <span style="font-size:9.5pt;color:#94a3b8">${T.licence}</span></div></div></section>`;
}
let html=coverPage()+introPage();
DOMAINS.forEach((d,i)=>{html+=domainPage(d,i+3);});
html+=closePage();
document.getElementById('book').innerHTML=html;
</script>
</body>
</html>
